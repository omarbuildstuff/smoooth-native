name: Cursorful
options:
  bundleIdPrefix: com.cursorful
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Cursorful:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Cursorful
        excludes:
          - "**/*.md"
    resources:
      - path: Cursorful/Resources/Assets.xcassets
        optional: true
    info:
      path: Cursorful/App/Info.plist
      properties:
        CFBundleName: Cursorful
        CFBundleDisplayName: Cursorful
        CFBundleIdentifier: com.cursorful.app
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.video
        LSUIElement: false
        NSHumanReadableCopyright: "© 2026"
        NSScreenCaptureDescription: "Cursorful needs screen recording access to capture your screen."
        NSCameraUsageDescription: "Cursorful uses your camera for picture-in-picture overlays."
        NSMicrophoneUsageDescription: "Cursorful records your microphone when narrating."
        NSSpeechRecognitionUsageDescription: "Cursorful transcribes recorded audio on-device."
        NSAppleEventsUsageDescription: "Cursorful uses Apple events to manage windows."
        NSMainStoryboardFile: ""
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
    entitlements:
      path: Cursorful/App/Cursorful.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorful.app
        PRODUCT_NAME: Cursorful
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        MTL_FAST_MATH: YES

  CursorfulTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CursorfulTests
    dependencies:
      - target: Cursorful
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cursorful.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Cursorful.app/Contents/MacOS/Cursorful"

schemes:
  Cursorful:
    build:
      targets:
        Cursorful: all
        CursorfulTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CursorfulTests
    archive:
      config: Release
